name: Build dnSpy (patched)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build dnSpy (netframework)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - uses: microsoft/setup-msbuild@v3.0.0

      # Makes the decompiler always emit enum member values, e.g. "MaxRevive = 0, LuckyEgg = 301"
      - name: Apply enum member value patch
        run: |
          git -C Extensions/ILSpy.Decompiler/ICSharpCode.Decompiler apply -v "$env:GITHUB_WORKSPACE/patches/0001-always-print-enum-member-values.patch"
          git -C Extensions/ILSpy.Decompiler/ICSharpCode.Decompiler diff --stat

      - name: Build dnSpy (netframework)
        run: .\build.ps1 netframework

      - name: Copy release files for upload
        run: |
          New-Item -ItemType Directory -Path C:\builtfiles\dnSpy-netframework -Force > $null
          Copy-Item -Path dnSpy\dnSpy\bin\Release\net48\* -Destination C:\builtfiles\dnSpy-netframework -Recurse

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dnSpy-netframework
          path: C:\builtfiles\dnSpy-netframework
          if-no-files-found: error
          compression-level: 9

      # Creates a unique release per run: <version>_<yyyy-dd-MM_HH-mm>
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path DnSpyCommon.props -Pattern '<DnSpyAssemblyInformationalVersion>([^<]+)<').Matches[0].Groups[1].Value
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-dd-MM_HH-mm')
          $tag = "${version}_${stamp}"
          Write-Host "Release tag: $tag"
          Compress-Archive -Path 'C:\builtfiles\dnSpy-netframework\*' -DestinationPath 'dnSpy-netframework.zip' -Force
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, updating asset"
            gh release upload $tag dnSpy-netframework.zip --clobber
          }
          else {
            gh release create $tag dnSpy-netframework.zip --target $env:GITHUB_SHA --title $tag --notes "dnSpy $version for .NET Framework, built $stamp UTC. Decompiler always prints enum member values (e.g. ``MaxRevive = 0``)."
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
